name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness (V8)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Game Engine
        id: engine
        shell: bash
        run: |
          engine_bin=$(./tools/ci/install-gameengine "$RUNNER_TEMP/tactile-game-engine")
          echo "$engine_bin" >> "$GITHUB_PATH"

      - name: Verify engine toolchain
        shell: bash
        run: ./tools/gameengine doctor --json

      - name: Run pre-push harness
        shell: bash
        env:
          HARNESS_JS: v8
        run: |
          mkdir -p artifacts/ci
          ./tools/harness prepush 2>&1 | tee artifacts/ci/harness.log

      - name: Upload harness log
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: harness-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/harness.log
          if-no-files-found: error
          retention-days: 14
